name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The dashboard is a self-contained Next.js app: typecheck, parity tests against Rithik's Python model, production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  data:
    # frontend/data/*.json must match what artifacts/ + app/risk_logic.py produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scikit-learn==1.8.0" joblib ruff
      - run: python scripts/export_frontend_data.py --check
      - run: ruff check .

  notebook:
    # Smoke-runs the whole notebook on the synthetic sample (DEMO MODE, no GPU → DistilBERT is skipped).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOMELENS_RUN_DISTILBERT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - name: Execute notebook
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute HomeLensAI_Final_Project.ipynb --output /tmp/executed.ipynb --ExecutePreprocessor.timeout=1200
