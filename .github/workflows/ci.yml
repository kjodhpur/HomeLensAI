name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check ..
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  notebook:
    # Smoke-runs the whole notebook on the synthetic sample (DEMO MODE, no GPU → DistilBERT is skipped).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOMELENS_RUN_DISTILBERT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - name: Execute notebook
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute HomeLensAI_Final_Project.ipynb --output /tmp/executed.ipynb --ExecutePreprocessor.timeout=1200
